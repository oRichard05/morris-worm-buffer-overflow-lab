<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050606">
  <title>research-vax — 4.3BSD UNIX</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="terminal-view">
    <div class="terminal-layout">
      <section id="glass" class="screen" aria-label="Reconstructed 4.3BSD UNIX terminal">
        <div id="terminal-output" class="screen-lines" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form id="command-form" class="command-form" autocomplete="off">
          <label for="command-input">research-vax% </label>
          <div class="terminal-input-wrap">
            <input id="command-input" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="UNIX command" maxlength="160">
            <span id="terminal-block-cursor" class="terminal-block-cursor" aria-hidden="true"> </span>
          </div>
        </form>
      </section>

      <aside class="memory-lab" aria-label="Interactive memory visualization">
        <header class="memory-header">
          <h1>MEMORY</h1>
          <div class="mode-switch" role="group" aria-label="C program version">
            <button id="mode-vulnerable" class="active" type="button" aria-pressed="true">VULNERABLE</button>
            <button id="mode-patched" type="button" aria-pressed="false">PATCHED</button>
          </div>
        </header>

        <div class="memory-workspace">
          <div class="ribbon-labels" aria-hidden="true">
            <span>BUFFER <small>16 BYTES</small></span>
            <span>ADJACENT <small>8 BYTES</small></span>
          </div>

          <div class="ribbon-container">
            <div id="memory-ribbon" class="memory-ribbon" role="group" aria-label="24 contiguous memory positions; click to inspect"></div>
            <span class="ribbon-limit" aria-hidden="true"></span>
            <span id="write-pointer" class="write-pointer" aria-hidden="true"></span>
          </div>

          <div class="address-ruler" aria-hidden="true">
            <span>0x00</span><span>0x10</span><span>0x17</span>
          </div>

          <div class="zoom-heading">
            <span id="zoom-range">0x10 — 0x17</span>
            <span>8-BYTE VIEW</span>
          </div>

          <div class="zoom-surface">
            <div id="zoom-bytes" class="zoom-bytes" role="group" aria-label="Eight enlarged memory bytes"></div>
          </div>

          <div class="byte-inspection">
            <span id="selected-address">0x10</span>
            <strong id="selected-value">0x5A</strong>
            <span id="selected-character">Z</span>
          </div>

          <div class="memory-outcome" aria-live="polite">
            <span id="memory-status">MEMORY READY</span>
            <span id="memory-delta">0 BYTES CHANGED</span>
          </div>
        </div>

        <footer class="memory-controls">
          <div class="playback-header">
            <span id="trace-count">0 / 0</span>
            <span id="run-mode">VULNERABLE</span>
          </div>
          <div class="playback-row">
            <button id="trace-play" type="button" disabled>REPLAY ↻</button>
            <input id="trace-seek" type="range" min="0" max="1" step="1" value="0" disabled aria-label="Move through reconstructed memory writes">
          </div>
        </footer>
      </aside>
    </div>
  </main>
</body>
</html>
