<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050606">
  <title>research-vax — 4.3BSD UNIX</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="terminal-view" class="terminal-view">
    <div class="terminal-layout">
      <section id="glass" class="screen" aria-label="Reconstructed 4.3BSD UNIX terminal">
        <div id="terminal-output" class="screen-lines" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form id="command-form" class="command-form" autocomplete="off">
          <label for="command-input">research-vax% </label>
          <div class="terminal-input-wrap">
            <input id="command-input" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="UNIX command" maxlength="160">
            <span id="terminal-block-cursor" class="terminal-block-cursor" aria-hidden="true"> </span>
          </div>
        </form>
      </section>

      <aside class="trace-panel" aria-label="Live-updating educational memory">
        <header class="memory-top">
          <span class="memory-heading">MEMORY</span>
          <div class="mode-switch" role="group" aria-label="C program version">
            <button type="button" id="mode-vulnerable" class="active" aria-pressed="true">VULNERABLE</button>
            <button type="button" id="mode-patched" aria-pressed="false">PATCHED</button>
          </div>
        </header>

        <div class="memory-scene">
          <div class="memory-region-label">
            <span>NAME</span>
            <span>16 BYTES</span>
          </div>
          <div id="name-bytes" class="memory-cells" aria-label="16 bytes reserved for the name"></div>

          <div id="boundary-line" class="boundary-line">
            <span class="boundary-stroke"></span>
            <strong id="boundary-caption">BUFFER LIMIT</strong>
            <span class="boundary-stroke"></span>
          </div>

          <div class="memory-region-label">
            <span>NEXT STEP</span>
            <span>8 BYTES</span>
          </div>
          <div id="next-bytes" class="memory-cells" aria-label="8 bytes immediately after the name buffer"></div>
        </div>

        <div class="memory-bottom">
          <div class="memory-reading">
            <span id="trace-state" class="memory-status" aria-live="polite">READY</span>
            <span id="trace-count" class="memory-progress">0 / 0</span>
          </div>
          <div class="trace-playback">
            <button id="trace-play" type="button" disabled>REPLAY <span aria-hidden="true">↻</span></button>
            <input id="trace-seek" type="range" min="0" max="1" step="1" value="0" disabled aria-label="Playback position in the reconstructed memory write">
          </div>
          <p id="byte-info" class="byte-info" hidden></p>
        </div>
      </aside>
    </div>
  </main>

</body>
</html>
